<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="app.title">Plant Watering</title>
<style>
*{box-sizing:border-box}
body{font:15px system-ui,sans-serif;max-width:900px;margin:auto;padding:16px;line-height:1.4}
h2{margin:8px 0 18px}h3{margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid #ddd}
section{margin:14px 0;padding:16px;border:1px solid #ddd;border-radius:9px}
.status-row{display:grid;grid-template-columns:180px 1fr;gap:10px;margin:8px 0}.status-label,label,.meta{color:#666}label{pointer-events:none}
.field{display:flex;align-items:center;gap:10px;margin:8px 0}.field label{flex:0 0 180px}
.field input:not([type="checkbox"]),.field select{width:100%;max-width:380px}.field.short input{max-width:140px}.field.medium input,.field.medium select{max-width:260px}
.field-row,.actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px}.field-row .field{margin:4px 0}
.field.compact label{flex:0 0 auto}
input,select,button{font:inherit;padding:8px;border:1px solid #bbb;border-radius:6px;background:#fff}input:focus,select:focus{outline:2px solid #78a985}
button{border-color:#287a43;background:#287a43;color:#fff;cursor:pointer}button.secondary{background:#fff;color:#287a43}button.danger{border-color:#b42318;background:#b42318}button.secondary.danger{background:#fff;color:#b42318}button:disabled{opacity:.5;cursor:default}
.actions{margin-top:10px}.reset-actions{margin-top:22px;padding-top:12px;border-top:1px solid #ddd}.badge{display:inline-block;justify-self:start;padding:2px 8px;border-radius:20px;background:#e2f2e6;color:#17602d;font-weight:600}
.worker{margin-top:14px;padding-top:12px;border-top:1px solid #ccc}.pot{margin:10px 0 0 18px;padding:10px;border-left:3px solid #b8d5bf;background:#fafafa}.pot-title{margin-bottom:6px}
table{width:100%;border-collapse:collapse}th,td{padding:7px;border:1px solid #ddd;text-align:left}th{background:#f5f5f5}.table-wrap{overflow-x:auto}
a{color:#1769aa}@media(max-width:600px){body{padding:10px}section{padding:12px}.status-row{grid-template-columns:1fr;gap:1px}.field,.field-row{display:block}.field label{display:block;margin-bottom:4px}.field input:not([type="checkbox"]),.field select,.field.short input,.field.medium input,.field.medium select{max-width:none}.field-row .field{margin:8px 0}.pot{margin-left:0}.actions button{min-height:42px}}
</style>
</head>
<body>
<h2 id="title">Plant Watering</h2>
<section>
<h3 data-i18n="main.sectionStatus">Status</h3>
<div>
    <div class="status-row"><span class="status-label" data-i18n="field.currentTime">Current time (HH:MM)</span><span><span id="time">-</span> (<span id="timezone">-</span>, <span id="clockSource">-</span>)</span></div>
    <div class="status-row"><span class="status-label" data-i18n="status.uptime">Uptime (HH:MM)</span><span id="uptime">-</span></div>
    <div class="status-row"><span class="status-label" data-i18n="status.tank">Water tank level</span><span id="tank">-</span></div>
    <div class="status-row"><span class="status-label" data-i18n="status.system">System status</span><span id="status" class="badge">-</span></div>
    <div class="status-row"><span class="status-label" data-i18n="status.autoMode">Auto mode</span><span id="auto">-</span></div>
    <div class="status-row"><span class="status-label" data-i18n="field.dataSyncInterval">Data sync interval (s)</span><span id="dsint">-</span></div>
    <div class="status-row"><span class="status-label" data-i18n="status.lastDataSync">Last data sync cycle</span><span id="lastDataSync">-</span></div>
    <div class="status-row"><span class="status-label" data-i18n="status.nextDataSync">Next data sync cycle</span><span id="nextDataSync">-</span></div>
</div>
<div>
    <button id="pumpBtn" onclick="togglePump()">Start Pump (max 10s)</button>
    <span id="pumpStatus" class="meta"></span>
</div>
</section>

<section>
<h3 data-i18n="main.sectionSettings">Settings</h3>
<div class="field long">
    <label for="name" data-i18n="common.name">Name</label>
    <input id="name" maxlength="64" placeholder="Main controller name (64 UTF-8 bytes max)" title="Up to 64 UTF-8 bytes, e.g. about 64 ASCII chars or 16 emoji." data-i18n-placeholder="main.mainNamePlaceholder" data-i18n-title="main.nameHelp">
</div>
<div class="field medium">
    <label for="language" data-i18n="field.language">Language</label>
    <select id="language" required>
        <option value="en" data-i18n="language.en">English</option>
        <option value="zh-CN" data-i18n="language.zh-CN">简体中文</option>
    </select>
</div>
<div class="field short">
    <label for="newTime" data-i18n="field.currentTime">Current time (HH:MM)</label>
    <input id="newTime" type="time">
</div>
<div class="field medium">
    <label for="tzOffset" data-i18n="field.timezone">Timezone offset (±HH:MM)</label>
    <select id="tzOffset" required aria-label="Timezone offset" data-i18n-aria-label="field.timezoneAria"></select>
</div>
<div class="field short">
    <label for="activeStart" data-i18n="field.activeStart">Active start (HH:MM)</label>
    <input id="activeStart" type="time" required>
</div>
<div class="field short">
    <label for="activeEnd" data-i18n="field.activeEnd">Active end (HH:MM)</label>
    <input id="activeEnd" type="time" required>
</div>
<div class="actions">
    <button id="syncTimeBtn" class="secondary" onclick="syncTime()" data-i18n="main.syncTime">Sync time (NTP)</button>
    <span id="syncStatus" style="margin-left:8px"></span>
</div>
<div class="field medium">
    <label for="newDsint" data-i18n="field.dataSyncInterval">Data sync interval (s)</label>
    <input id="newDsint" type="number" placeholder="60-2419200 (28 days)" data-i18n-placeholder="placeholder.interval" min="60" max="2419200" step="1" required>
</div>
<div class="field short">
    <label for="newPumpDelay" data-i18n="field.pumpDelay">Pump activation delay (s)</label>
    <input id="newPumpDelay" type="number" min="0" max="30" step="1" required>
</div>
<div class="field short">
    <label for="newManualPumpTimeout" data-i18n="field.manualPumpTimeout">Manual pump timeout (s)</label>
    <input id="newManualPumpTimeout" type="number" min="1" max="60" step="1" required>
</div>
<div class="field short">
    <label for="newAuto" data-i18n="field.auto">Auto</label>
    <input id="newAuto" type="checkbox">
</div>
<div class="actions">
    <button id="applySettingsBtn" onclick="applySettings()" data-i18n="main.applySettings">Apply Settings</button>
    <span id="settingsStatus" style="margin-left:8px"></span>
</div>
<div class="actions reset-actions">
    <button id="clearWifiBtn" class="secondary danger" onclick="clearWifiCredConfirm()" data-i18n="main.clearWifi">Clear WiFi Credentials</button>
    <button id="clearAllBtn" class="danger" onclick="clearAllSettingsConfirm()" data-i18n="main.resetAll">Reset All Settings</button>
    <span id="wifiStatus" style="margin-left:8px"></span>
    <span id="resetStatus" style="margin-left:8px"></span>
</div>
</section>

<section>
<h3 data-i18n="main.sectionWorkers">Workers</h3>
<div>
    <form id="addForm" onsubmit="return false;">
        <div class="field medium"><label for="wmac" data-i18n="field.macHex">MAC (hex)</label><input id="wmac" placeholder="AABBCCDDEEFF" maxlength="12" pattern="[0-9A-Fa-f]{12}" autocomplete="off" spellcheck="false" required></div>
        <div class="field long"><label for="wname" data-i18n="common.name">Name</label><input id="wname" maxlength="64" placeholder="Worker name (64 UTF-8 bytes max)" title="Up to 64 UTF-8 bytes, e.g. about 64 ASCII chars or 16 emoji." data-i18n-placeholder="main.workerNamePlaceholder" data-i18n-title="main.nameHelp"></div>
        <!-- Threshold and duration removed from quick add; defaults used -->
    <div class="actions"><button onclick="addWorker()" data-i18n="main.addWorker">Add Worker</button></div>
    </form>
</div>
</section>
<section>
<h3 id="workerListHeader">Worker list (-/-)</h3>
<div style="margin-top:8px">
    <div class="actions">
    <button id="applyAllBtn" onclick="applyAll()" disabled data-i18n="main.applyAll">Apply All</button>
    </div>
    <div id="workersList">Loading...</div>
</div>
</section>

<section id="diagnosticsSection">
    <h3 data-i18n="diagnostics.section">Diagnostics</h3>
    <div class="table-wrap"><table id="diagTable"><tr><th data-i18n="diagnostics.metric">Metric</th><th data-i18n="common.value">Value</th></tr></table></div>
</section>

<div><a href="/?debug=true" data-i18n="common.debug">Debug</a> | <a href="/ota" data-i18n="main.firmwareUpdate">Firmware Update</a></div>

<script>
/*__I18N_MESSAGES__*/
const dirty = new Set();
const pending = new Set();
const NAME_MAX_BYTES = 64;
const utf8Encoder = new TextEncoder();
const urlParams = new URLSearchParams(window.location.search);
const debugMode = urlParams.get('debug') === 'true';
let autoMode = false;
let manualPumpActive = false;
let manualPumpTimeout = 10;
let tankSafe = false;
let settingsInputsLoaded = false;
let maxWorkerCount = 8;
let currentWorkerCount = 0;
let currentLanguage = 'en';
let pageBootstrapped = false;

function hasTranslation(key, language = currentLanguage) {
    return Object.prototype.hasOwnProperty.call(I18N_MESSAGES[language] || {}, key);
}

function t(key, values = {}) {
    const catalog = I18N_MESSAGES[currentLanguage] || I18N_MESSAGES.en;
    let text = catalog[key] ?? I18N_MESSAGES.en[key] ?? key;
    return text.replace(/\{(\w+)\}/g, (match, name) =>
        Object.prototype.hasOwnProperty.call(values, name) ? String(values[name]) : match);
}

function applyStaticTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(element => {
        element.textContent = t(element.dataset.i18n);
    });
    for (const attribute of ['placeholder', 'title', 'aria-label']) {
        const dataName = 'i18n' + attribute.split('-').map(part =>
            part.charAt(0).toUpperCase() + part.slice(1)).join('');
        document.querySelectorAll(`[data-i18n-${attribute}]`).forEach(element => {
            element.setAttribute(attribute, t(element.dataset[dataName]));
        });
    }
    document.documentElement.lang = currentLanguage;
}

function setLanguage(language) {
    const next = Object.prototype.hasOwnProperty.call(I18N_MESSAGES, language) ? language : 'en';
    if (currentLanguage === next && document.documentElement.lang === next) return false;
    currentLanguage = next;
    const languageInput = document.getElementById('language');
    if (languageInput) languageInput.value = next;
    applyStaticTranslations();
    updateWorkerListHeader(currentWorkerCount);
    updateManualControls();
    return true;
}

function translatedCode(prefix, code, fallback = null) {
    const key = prefix + String(code || '');
    return hasTranslation(key) ? t(key) : (fallback || code || '-');
}

function protocolErrorText(code, fallbackKey) {
    if (code && hasTranslation('protocol.' + code)) return t('protocol.' + code);
    return code || (fallbackKey ? t(fallbackKey) : '-');
}

function clampUtf8Value(value, maxBytes) {
    if (utf8Encoder.encode(value).length <= maxBytes) return value;
    let out = '';
    for (const ch of value) {
    if (utf8Encoder.encode(out + ch).length > maxBytes) break;
    out += ch;
    }
    return out;
}

function sanitizeNameInput(input) {
    if (!input) return '';
    const cleaned = (input.value || '').replace(/[\u0000-\u001f\u007f-\u009f]/g, '');
    const clamped = clampUtf8Value(cleaned, NAME_MAX_BYTES);
    if (input.value !== clamped) input.value = clamped;
    return clamped;
}

function sanitizeMacInput(input) {
    if (!input) return '';
    const cleaned = (input.value || '').replace(/[^0-9a-f]/gi, '').slice(0, 12).toUpperCase();
    if (input.value !== cleaned) input.value = cleaned;
    return cleaned;
}

function readIntegerInput(input) {
    if (!input || !input.checkValidity()) throw new Error('Invalid input');
    const value = Number(input.value);
    if (!Number.isSafeInteger(value)) throw new Error('Invalid integer');
    return value;
}

function updateWorkerListHeader(count) {
    currentWorkerCount = count;
    const header = document.getElementById('workerListHeader');
    if (header) header.innerText = t('main.workerList', {count, max: maxWorkerCount});
}

function populateTimezoneOptions() {
    const select = document.getElementById('tzOffset');
    if (!select || select.options.length) return;
    for (let minutes = -14 * 60; minutes <= 14 * 60; minutes += 15) {
    const sign = minutes < 0 ? '-' : '+';
    const absolute = Math.abs(minutes);
    const label = sign + String(Math.floor(absolute / 60)).padStart(2, '0') + ':' + String(absolute % 60).padStart(2, '0');
    const option = document.createElement('option');
    option.value = String(minutes);
    option.textContent = 'UTC' + label;
    select.appendChild(option);
    }
}

function setWaterButtonBlocked(button, blocked) {
    if (!button) return;
    button.dataset.manualBlocked = blocked ? '1' : '0';
    button.disabled = autoMode || blocked;
}

function updateManualControls() {
    const pumpBtn = document.getElementById('pumpBtn');
    const pumpStatus = document.getElementById('pumpStatus');
    if (pumpBtn) {
    pumpBtn.disabled = !manualPumpActive && (autoMode || !tankSafe);
    pumpBtn.innerText = manualPumpActive ? t('pump.stop') : t('pump.start', {seconds: manualPumpTimeout});
    pumpBtn.title = !manualPumpActive && !tankSafe ? t('protocol.TANK_UNSAFE') : '';
    }
    if (pumpStatus) pumpStatus.innerText = !manualPumpActive && !tankSafe ? t('protocol.TANK_UNSAFE') : '';
    document.querySelectorAll('.waterBtn').forEach(btn => {
    const blocked = btn.dataset.manualBlocked === '1';
    btn.disabled = autoMode || blocked;
    });
}

function markDirty(id) {
    dirty.add(id);
    updateButtons();
}

window.addEventListener('beforeunload', event => {
    if (dirty.size === 0) return;
    event.preventDefault();
    event.returnValue = '';
});

function updateButtons(){
    document.querySelectorAll('.worker').forEach(wel=>{
    const mac = wel.dataset.mac;
    const applyBtn = wel.querySelector('.applyWorkerBtn');
    const anyDirty = Array.from(dirty).some(id => id.startsWith(mac + '-'));
    if (applyBtn) applyBtn.disabled = !anyDirty || pending.size > 0;
    });
    document.getElementById('applyAllBtn').disabled = dirty.size === 0 || pending.size > 0;
}

// Global status timers and setter so other functions can display transient status messages.
const statusTimers = {};
function setStatus(id, msg, ok) {
    // Try pot/node-level status first
    const nodeEl = document.querySelector(`.node[data-id="${id}"]`);
    if (nodeEl) {
    const span = nodeEl.querySelector('.status');
    if (!span) return;
    span.innerText = msg || '';
    span.style.color = ok ? 'green' : 'crimson';
    if (statusTimers[id]) clearTimeout(statusTimers[id]);
    if (msg) statusTimers[id] = setTimeout(()=>{ span.innerText=''; delete statusTimers[id]; }, 3000);
    return;
    }
    // Fallback: worker-level status (id like MAC-all)
    if (typeof id === 'string' && id.endsWith('-all')) {
    const mac = id.slice(0, -4);
    const workerDiv = document.querySelector(`.worker[data-mac="${mac}"]`);
    if (!workerDiv) return;
    let wstatus = workerDiv.querySelector('.wstatus');
    if (!wstatus) {
        wstatus = document.createElement('span');
        wstatus.className = 'wstatus';
        wstatus.style.marginLeft = '8px';
        const headerDiv = workerDiv.querySelector('div');
        if (headerDiv) headerDiv.appendChild(wstatus);
    }
    wstatus.innerText = msg || '';
    wstatus.style.color = ok ? 'green' : 'crimson';
    if (statusTimers[id]) clearTimeout(statusTimers[id]);
    if (msg) statusTimers[id] = setTimeout(()=>{ wstatus.innerText=''; delete statusTimers[id]; }, 3000);
    }
}

function getNodePayloadEl(el){
    return {
    mac: el.dataset.mac,
    potIndex: Number(el.dataset.pi),
    name: sanitizeNameInput(el.querySelector('.iname')),
    threshold: readIntegerInput(el.querySelector('.ith')),
    duration: readIntegerInput(el.querySelector('.idur')),
    waterInterval: readIntegerInput(el.querySelector('.iwint'))
    };
}

async function applyNode(el){
    const id = el.dataset.id;
    if (pending.has(id)) return;
    pending.add(id); updateButtons();
    try {
    const payload = getNodePayloadEl(el);
    const res = await fetch('/worker/update', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    if (!res.ok) throw new Error(await res.text());
    dirty.delete(id);
    setStatus(id, t('status.saved'), true);
    } catch (e) {
    console.error('applyNode', id, e);
    setStatus(id, t('error.saveFailed'), false);
    } finally {
    pending.delete(id); updateButtons();
    }
}

async function applyAll(){
    if (pending.size) return;
    const ids = Array.from(dirty);
    if (ids.length===0) return;
    // apply sequentially to avoid flooding
    for (let i=0;i<ids.length;i++){
    if (ids[i].endsWith('-worker')) {
        const mac = ids[i].slice(0, -7);
        const wel = document.querySelector(`.worker[data-mac="${mac}"]`);
        if (wel) await applyWorker(wel);
    } else {
        const el = document.querySelector(`.node[data-id="${ids[i]}"]`);
        if (el) await applyNode(el);
    }
    }
    // refresh list after (full rebuild to capture input changes)
    setTimeout(refreshWorkersFull,300);
}

async function applyWorker(wel){
    const mac = wel.dataset.mac;
    const id = mac + '-worker';
    if (pending.has(id)) return;
    pending.add(id); updateButtons();
    const payload = { mac: mac, workerName: sanitizeNameInput(wel.querySelector('.wname')) };
    try {
    const res = await fetch('/worker/update', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    if (!res.ok) throw new Error(await res.text());
    dirty.delete(id);
    setStatus(mac+'-all', t('status.saved'), true);
    } catch (e) {
    console.error('applyWorker', mac, e);
    setStatus(mac+'-all', t('error.saveFailed'), false);
    } finally {
    pending.delete(id); updateButtons();
    }
}

// Full rebuild of worker list including inputs and event bindings.
async function refreshWorkersFull(){
    let r = await fetch('/nodes');
    let list = await r.json();
    let container = document.getElementById('workersList');
    container.innerHTML = '';

    const workers = list.map(w => ({
    mac: w.mac,
    workerName: w.workerName || '',
    battery: w.battery ?? null,
    batteryMv: w.batteryMv ?? null,
    lastSyncAgo: w.lastSyncAgo ?? null,
    rssi: w.rssi ?? null,
    nodePotCount: w.nodePotCount,
    pots: (w.pots || []).map(p => ({ potIndex: (typeof p.index === 'number' ? p.index : 0), name: p.name, threshold: p.threshold, duration: p.duration, waterInterval: p.waterInterval, soil: p.soil, soilRaw: p.soilRaw ?? null, lastAutoWateringAgo: p.lastAutoWateringAgo ?? null }))
    }));
    workers.forEach(w => w.pots.sort((a,b)=> (a.potIndex - b.potIndex)));
    updateWorkerListHeader(workers.length);

    if (workers.length === 0) {
    container.innerText = t('main.noWorkers');
    updateManualControls();
    updateButtons();
    return;
    }

    let idx = 0;
    for (const worker of workers) {
    idx++;
    // worker header
    const workerDiv = document.createElement('div');
    workerDiv.className = 'worker';
    workerDiv.dataset.mac = worker.mac;
    workerDiv.innerHTML = `
        <div><strong>${idx}. ${worker.mac}</strong></div>
        <div class="field long">
        <label for="workerName-${worker.mac}">${escapeHtml(t('main.workerName'))}</label>
        <input id="workerName-${worker.mac}" class="wname" value="${escapeHtml(worker.workerName)}" maxlength="64" title="${escapeHtml(t('main.nameHelp'))}">
        </div>
        <div class="wmeta meta">${escapeHtml(formatWorkerMeta(worker))}</div>
        <div class="actions">
        <button class="applyWorkerBtn">${escapeHtml(t('common.apply'))}</button>
        <button class="removeAllBtn secondary danger">${escapeHtml(t('common.remove'))}</button>
        </div>
    `;
    container.appendChild(workerDiv);
    // bind apply for this worker (apply all dirty pots for the worker)
    const applyWorkerBtn = workerDiv.querySelector('.applyWorkerBtn');
    const workerNameInput = workerDiv.querySelector('.wname');
    workerNameInput.addEventListener('input', ()=> { sanitizeNameInput(workerNameInput); markDirty(worker.mac + '-worker'); });
    applyWorkerBtn.addEventListener('click', async ()=>{
        if (pending.size) return;
        if (dirty.has(worker.mac + '-worker')) await applyWorker(workerDiv);
        const nodes = workerDiv.querySelectorAll('.node');
        for (let i=0;i<nodes.length;i++){
        const el = nodes[i];
        if (dirty.has(el.dataset.id)) await applyNode(el);
        }
        setTimeout(refreshWorkersFull,300);
    });
    // bind remove all
    const removeAllBtn = workerDiv.querySelector('.removeAllBtn');
    removeAllBtn.addEventListener('click', async ()=> {
        setStatus(worker.mac+'-all', t('status.removing'), false);
        const ok = await removeWorker(worker.mac);
        if (ok) { setStatus(worker.mac+'-all', t('status.removed'), true); setTimeout(refreshWorkersFull,300); } else setStatus(worker.mac+'-all', t('error.removeFailed'), false);
    });

    // render pots (ordered by potIndex)
    if (!worker.pots || worker.pots.length === 0) {
        const p = document.createElement('div');
        p.innerText = t('main.noPots');
        workerDiv.appendChild(p);
    } else {
        for (let pi=0; pi<worker.pots.length; ++pi) {
        const pot = worker.pots[pi];
        const div = document.createElement('div');
        div.className = 'node pot';
        div.dataset.mac = worker.mac;
        div.dataset.pi = (pot.potIndex===undefined?0:pot.potIndex);
        const id = worker.mac + '-' + div.dataset.pi;
        div.dataset.id = id;
        div.innerHTML = `
            <div class="pot-title"><strong>${escapeHtml(t('main.pot', {number: pot.potIndex+1}))}</strong></div>
            <div class="field-row">
            <div class="field long compact">
                <label for="potName-${id}">${escapeHtml(t('common.name'))}</label>
                <input id="potName-${id}" class="iname" value="${escapeHtml(pot.name||'')}" maxlength="64" title="${escapeHtml(t('main.nameHelp'))}">
            </div>
            <div class="field short compact">
                <label for="potThreshold-${id}">${escapeHtml(t('field.threshold'))}</label>
                <input id="potThreshold-${id}" class="ith" type="number" value="${pot.threshold}" min="0" max="4095" step="1" required>
            </div>
            <div class="field short compact">
                <label for="potDuration-${id}">${escapeHtml(t('field.duration'))}</label>
                <input id="potDuration-${id}" class="idur" type="number" value="${pot.duration}" min="1" max="60" step="1" required>
            </div>
            <div class="field medium compact">
                <label for="potWaterInterval-${id}">${escapeHtml(t('field.waterInterval'))}</label>
                <input id="potWaterInterval-${id}" class="iwint" type="number" value="${pot.waterInterval}" min="60" max="2419200" step="1" required>
            </div>
            </div>
            <div class="meta">
                <span class="soil">${formatSoil(pot)}</span>
                <span class="lastwater" style="margin-left:8px">${escapeHtml(t('metric.lastAutoWater', {value: formatRelativeAge(pot.lastAutoWateringAgo)}))}</span>
            </div>
            <div class="actions">
                <button class="waterBtn secondary" disabled>${escapeHtml(t('main.openValve'))}</button>
                <span class="status" style="margin-left:8px"></span>
            </div>
        `;
        const iname = div.querySelector('.iname');
        const ith = div.querySelector('.ith');
        const idur = div.querySelector('.idur');
        const iwint = div.querySelector('.iwint');
        iname.addEventListener('input', ()=> { sanitizeNameInput(iname); markDirty(id); });
        ith.addEventListener('input', ()=> markDirty(id));
        idur.addEventListener('input', ()=> markDirty(id));
        iwint.addEventListener('input', ()=> markDirty(id));
        const waterBtn = div.querySelector('.waterBtn');
        // display sensor status and disable water button if sensor not connected or worker not synced
        const soilSpan = div.querySelector('.soil');
        const lastSpan = div.querySelector('.lastwater');
        const synced = worker.lastSyncAgo != null;
        if (isSoilDisconnected(pot)) {
            soilSpan.innerText = formatSoil(pot);
            setWaterButtonBlocked(waterBtn, true);
        } else {
            soilSpan.innerText = formatSoil(pot);
            setWaterButtonBlocked(waterBtn, !synced);
        }
        if (lastSpan) lastSpan.innerText = t('metric.lastAutoWater', {value: formatRelativeAge(pot.lastAutoWateringAgo)});
        waterBtn.addEventListener('click', async ()=> {
            let dur;
            try { dur = readIntegerInput(idur); } catch (e) { idur.reportValidity(); return; }
            setStatus(id, t('status.sending'), false);
            const ok = await waterWorker(div.dataset.mac, Number(div.dataset.pi), dur);
            if (ok) setStatus(id, t('status.valveCommandSent'), true); else setStatus(id, t('error.sendFailed'), false);
        });
        workerDiv.appendChild(div);
        }
    }
    }
    updateManualControls();
    updateButtons();
}

// Partial refresh: only update non-input information (battery, last sync, rssi, soil, last water)
async function refreshWorkersPartial(){
    try {
    let r = await fetch('/nodes');
    let list = await r.json();
    // Group by MAC like full
    const workers = list.map(w => ({
        mac: w.mac,
        battery: w.battery ?? null,
        batteryMv: w.batteryMv ?? null,
        lastSyncAgo: w.lastSyncAgo ?? null,
        rssi: w.rssi ?? null,
        pots: (w.pots || []).map(p => ({ potIndex: (typeof p.index === 'number' ? p.index : 0), soil: p.soil, soilRaw: p.soilRaw ?? null, lastAutoWateringAgo: p.lastAutoWateringAgo ?? null }))
    }));
    workers.forEach(w => w.pots.sort((a,b)=> (a.potIndex - b.potIndex)));

    const renderedWorkers = document.querySelectorAll('.worker');
    let structureChanged = renderedWorkers.length !== workers.length;
    if (!structureChanged) {
        structureChanged = workers.some(worker => {
        const workerDiv = document.querySelector(`.worker[data-mac="${worker.mac}"]`);
        if (!workerDiv) return true;
        const renderedPots = Array.from(workerDiv.querySelectorAll('.node'))
            .map(node => Number(node.dataset.pi)).sort((a,b)=>a-b);
        const expectedPots = worker.pots.map(pot => pot.potIndex);
        return renderedPots.length !== expectedPots.length ||
            renderedPots.some((potIndex, index) => potIndex !== expectedPots[index]);
        });
    }
    if (structureChanged && dirty.size === 0 && pending.size === 0) {
        await refreshWorkersFull();
        return;
    }

    for (const worker of workers) {
        const workerDiv = document.querySelector(`.worker[data-mac="${worker.mac}"]`);
        if (!workerDiv) continue; // skip workers not present in DOM (added/removed -> full refresh will handle)
        // update header meta
        const winfo = workerDiv.querySelector('.wmeta');
        if (winfo) {
        winfo.innerText = formatWorkerMeta(worker);
        }
        // update pots
        for (let pi=0; pi<worker.pots.length; ++pi) {
        const pot = worker.pots[pi];
        const node = workerDiv.querySelector(`.node[data-pi="${pot.potIndex}"]`);
        if (!node) continue;
        const soilSpan = node.querySelector('.soil');
        const lastSpan = node.querySelector('.lastwater');
        const waterBtn = node.querySelector('.waterBtn');
        const synced = worker.lastSyncAgo != null;
        if (soilSpan) {
            soilSpan.innerText = formatSoil(pot);
        }
        if (lastSpan) lastSpan.innerText = t('metric.lastAutoWater', {value: formatRelativeAge(pot.lastAutoWateringAgo)});
        setWaterButtonBlocked(waterBtn, (isSoilDisconnected(pot) || !synced));
        }
    }
    updateManualControls();
    updateButtons();
    } catch (e) { console.error('refreshWorkersPartial', e); }
}

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function finiteNumber(value) {
    return typeof value === 'number' && Number.isFinite(value);
}

function formatBattery(worker) {
    const value = worker && finiteNumber(worker.battery) ? worker.battery + '%' : '-';
    let text = t('metric.battery', {value});
    if (debugMode && worker && finiteNumber(worker.batteryMv)) text += ' (' + worker.batteryMv + ' mV)';
    return text;
}

function formatWorkerMeta(worker) {
    const rssi = worker && finiteNumber(worker.rssi) ? worker.rssi + ' dBm' : '-';
    return [
    formatBattery(worker),
    t('metric.lastSync', {value: formatRelativeAge(worker ? worker.lastSyncAgo : null)}),
    t('metric.rssi', {value: rssi})
    ].join(' ');
}

function isSoilDisconnected(pot) {
    return pot && finiteNumber(pot.soilRaw) && pot.soilRaw < 50;
}

function formatSoil(pot) {
    if (isSoilDisconnected(pot)) {
    let text = t('metric.soilMoisture', {value: t('metric.sensorNotConnected')});
    if (debugMode && finiteNumber(pot.soilRaw)) text += ' (' + t('metric.raw', {value: pot.soilRaw}) + ')';
    return text;
    }
    let text = t('metric.soilMoisture', {value: pot && finiteNumber(pot.soil) ? pot.soil : '-'});
    if (debugMode && pot && finiteNumber(pot.soilRaw)) text += ' (' + t('metric.raw', {value: pot.soilRaw}) + ')';
    return text;
}

function relativeParts(secondsValue){
    const seconds = Math.floor(secondsValue);
    let value;
    let unit;
    if (seconds < 60) {
    value = seconds;
    unit = 'second';
    } else if (seconds < 3600) {
    value = Math.floor(seconds / 60);
    unit = 'minute';
    } else if (seconds < 86400) {
    value = Math.floor(seconds / 3600);
    unit = 'hour';
    } else {
    value = Math.floor(seconds / 86400);
    unit = 'day';
    }
    return {value, unit};
}

function formatRelative(value, future) {
    if (typeof value !== 'number' || !Number.isFinite(value) || value < 0) return '-';
    const parts = relativeParts(value);
    try {
    return new Intl.RelativeTimeFormat(currentLanguage, {numeric:'always'}).format(
        future ? parts.value : -parts.value, parts.unit);
    } catch (e) {
    const unit = t(`unit.${parts.unit}.${parts.value === 1 ? 'one' : 'other'}`);
    return t(future ? 'relative.future' : 'relative.past', {value: parts.value, unit});
    }
}

function formatRelativeAge(ageSeconds){
    return formatRelative(ageSeconds, false);
}

function formatRelativeFuture(secondsUntil){
    return formatRelative(secondsUntil, true);
}

function formatUptime(uptimeSeconds){
    if (typeof uptimeSeconds !== 'number' || !Number.isFinite(uptimeSeconds) || uptimeSeconds < 0) return '-';
    const seconds = Math.floor(uptimeSeconds);
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0');
}

    }

async function applySettings(){
    const btn = document.getElementById('applySettingsBtn');
    const status = document.getElementById('settingsStatus');
    const timeVal = (document.getElementById('newTime').value || '').trim();
    try {
    const activeStartInput = document.getElementById('activeStart');
    const activeEndInput = document.getElementById('activeEnd');
    const timezoneInput = document.getElementById('tzOffset');
    const languageInput = document.getElementById('language');
    const requiredInputs = [languageInput, timezoneInput, activeStartInput, activeEndInput, document.getElementById('newDsint'), document.getElementById('newPumpDelay'), document.getElementById('newManualPumpTimeout')];
    const invalid = requiredInputs.find(input => !input || !input.checkValidity());
    if (invalid) { if (invalid.reportValidity) invalid.reportValidity(); throw new Error('Invalid settings'); }
    const timeToSeconds = input => {
        const match = input.value.match(/^(\d{2}):(\d{2})$/);
        if (!match) throw new Error('Invalid time');
        return Number(match[1]) * 3600 + Number(match[2]) * 60;
    };
    const body = {
        name:sanitizeNameInput(document.getElementById('name')),
        language:languageInput.value,
        auto:document.getElementById('newAuto').checked,
        dsint:readIntegerInput(document.getElementById('newDsint')),
        pumpDelay:readIntegerInput(document.getElementById('newPumpDelay')),
        manualPumpTimeout:readIntegerInput(document.getElementById('newManualPumpTimeout')),
        tzOffsetMinutes:readIntegerInput(timezoneInput),
        activeStart:timeToSeconds(activeStartInput),
        activeEnd:timeToSeconds(activeEndInput)
    };
    if (timeVal) body.newTime = timeVal;
    btn.disabled = true;
    status.innerText = t('status.saving'); status.style.color = 'gray';
    const res = await fetch('/settings', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if (!res.ok) throw new Error(await res.text());
    setLanguage(languageInput.value);
    status.innerText = t('status.saved'); status.style.color = 'green';
    settingsInputsLoaded = false;
    setTimeout(fetchStatus,300);
    setTimeout(refreshWorkersFull,300);
    if (debugMode) setTimeout(fetchDiagnostics,300);
    } catch (e) {
    status.innerText = t('error.saveFailed'); status.style.color = 'crimson';
    } finally {
    btn.disabled = false;
    setTimeout(()=>{ status.innerText = ''; }, 3000);
    }
}

async function syncTime(){
    const btn = document.getElementById('syncTimeBtn');
    const status = document.getElementById('syncStatus');
    if (!btn || !status) return;
    btn.disabled = true; status.innerText = t('status.syncing'); status.style.color = 'gray';
    try {
    const res = await fetch('/time/sync', {method:'POST'});
    const j = await res.json();
    if (!res.ok || !j.ok) throw new Error(JSON.stringify(j));
    timeSyncRequested = true;
    await fetchStatus();
    } catch (e) {
    status.innerText = t('error.syncFailed'); status.style.color = 'crimson';
    btn.disabled = false;
    setTimeout(()=>{ status.innerText=''; }, 3000);
    }
}

let timeSyncRequested = false;

function updateTimeSyncStatus(j) {
    if (!timeSyncRequested) return;
    const btn = document.getElementById('syncTimeBtn');
    const status = document.getElementById('syncStatus');
    if (!btn || !status) return;
    if (j.clockSyncPending) {
    btn.disabled = true;
    status.innerText = t('status.syncing'); status.style.color = 'gray';
    return;
    }
    timeSyncRequested = false;
    btn.disabled = false;
    if (j.clockSyncError) {
    status.innerText = t('error.syncFailed'); status.style.color = 'crimson';
    } else {
    status.innerText = t('status.synced'); status.style.color = 'green';
    }
    setTimeout(()=>{ status.innerText=''; }, 3000);
}

async function fetchStatus(){
    try {
    let r = await fetch('/status');
    let j = await r.json();
    const languageChanged = setLanguage(j.language);
    tankSafe = j.tankSafe === true;
    const uptimeSpan = document.getElementById('uptime');
    if (uptimeSpan) uptimeSpan.innerText = formatUptime(j.now);
    const tankEl = document.getElementById('tank');
    if (tankEl) {
        let ttext = '-';
        if (typeof j.tank === 'number') {
        const v = j.tank;
        if (v < 10) ttext = t('state.tank.low');
        else if (v > 2800) ttext = t('state.tank.high');
        else ttext = t('state.tank.notConnected');
        if (debugMode) ttext += ' (' + t('metric.raw', {value: v + ' mV'}) + ')';
        }
        tankEl.innerText = ttext;
    }

    if (j.clockValid && typeof j.timeOfDaySec === 'number') {
        const hh = Math.floor(j.timeOfDaySec/3600)%24;
        const mm = Math.floor((j.timeOfDaySec%3600)/60);
        const s = String(hh).padStart(2,'0')+':' + String(mm).padStart(2,'0');
        const timeSpan = document.getElementById('time');
        if (timeSpan) timeSpan.innerText = s;
    } else {
        const timeSpan = document.getElementById('time');
        if (timeSpan) timeSpan.innerText = t('state.time.invalid');
    }
    const sourceSpan = document.getElementById('clockSource');
    if (sourceSpan) {
        const source = typeof j.clockSource === 'string' ? j.clockSource.toLowerCase() : 'uninitialized';
        sourceSpan.innerText = translatedCode('state.clock.', source, source);
    }
    updateTimeSyncStatus(j);

    const autoSpan = document.getElementById('auto');
    autoMode = !!j.auto;
    manualPumpActive = !!j.manualPumpActive;
    if (Number.isSafeInteger(j.manualPumpTimeout)) manualPumpTimeout = j.manualPumpTimeout;
    if (autoSpan) autoSpan.innerText = autoMode ? t('state.on') : t('state.off');

    const dsintSpan = document.getElementById('dsint');
    if (dsintSpan) dsintSpan.innerText = j.dataSyncInterval || 3600;
    const lastDataSyncSpan = document.getElementById('lastDataSync');
    if (lastDataSyncSpan) lastDataSyncSpan.innerText = formatRelativeAge(j.lastDataSyncAgo);
    const nextDataSyncSpan = document.getElementById('nextDataSync');
    if (nextDataSyncSpan) nextDataSyncSpan.innerText = formatRelativeFuture(j.nextDataSyncIn);
    const statusSpan = document.getElementById('status');
    if (statusSpan) statusSpan.innerText = translatedCode('state.main.', j.state, j.state || '-');
    if (Number.isSafeInteger(j.maxWorkerCount)) maxWorkerCount = j.maxWorkerCount;
    if (Number.isSafeInteger(j.workerCount)) updateWorkerListHeader(j.workerCount);

    const title = document.getElementById('title');
    if (title) title.innerText = j.name ? t('app.titleNamed', {name: j.name}) : t('app.title');

    // populate timezone display every refresh, but editable settings inputs only on page load
    try {
        if (typeof j.tzOffsetMinutes === 'number') {
        const tzSpan = document.getElementById('timezone');
        if (tzSpan) {
            const mins = j.tzOffsetMinutes;
            const sign = mins < 0 ? '-' : '+';
            const am = Math.abs(mins);
            const hh = Math.floor(am/60).toString().padStart(2,'0');
            const mm = (am%60).toString().padStart(2,'0');
            tzSpan.innerText = sign + hh + ':' + mm;
        }
        }
        if (!settingsInputsLoaded) populateSettingsInputs(j);
    } catch(e) {}

    updateManualControls();
    if (languageChanged && pageBootstrapped) {
        await refreshWorkersFull();
        if (debugMode) await fetchDiagnostics();
    }
    } catch (e) {
    console.error('fetchStatus', e);
    }
}

function formatTimeInput(secondsOfDay){
    const s = secondsOfDay || 0;
    const hh = Math.floor(s/3600)%24;
    const mm = Math.floor((s%3600)/60);
    return String(hh).padStart(2,'0')+':' + String(mm).padStart(2,'0');
}

function populateSettingsInputs(j){
    const nameInput = document.getElementById('name');
    if (nameInput) { nameInput.value = j.name || ''; sanitizeNameInput(nameInput); }
    const autoInput = document.getElementById('newAuto');
    if (autoInput) autoInput.checked = !!j.auto;
    const languageInput = document.getElementById('language');
    if (languageInput) languageInput.value = j.language === 'zh-CN' ? 'zh-CN' : 'en';
    if (typeof j.activeStart === 'number') {
    const el = document.getElementById('activeStart');
    if (el) el.value = formatTimeInput(j.activeStart);
    }
    if (typeof j.activeEnd === 'number') {
    const el = document.getElementById('activeEnd');
    if (el) el.value = formatTimeInput(j.activeEnd);
    }
    if (typeof j.dataSyncInterval === 'number') {
    const el = document.getElementById('newDsint');
    if (el) el.value = j.dataSyncInterval;
    }
    if (typeof j.pumpDelay === 'number') {
    const el = document.getElementById('newPumpDelay');
    if (el) el.value = j.pumpDelay;
    }
    if (typeof j.manualPumpTimeout === 'number') {
    const el = document.getElementById('newManualPumpTimeout');
    if (el) el.value = j.manualPumpTimeout;
    }
    if (typeof j.tzOffsetMinutes === 'number') {
    const el = document.getElementById('tzOffset');
    if (el) {
        const savedValue = String(j.tzOffsetMinutes);
        if (!Array.from(el.options).some(option => option.value === savedValue)) {
        const sign = j.tzOffsetMinutes < 0 ? '-' : '+';
        const absolute = Math.abs(j.tzOffsetMinutes);
        const option = document.createElement('option');
        option.value = savedValue;
        option.textContent = 'UTC' + sign + String(Math.floor(absolute / 60)).padStart(2, '0') + ':' + String(absolute % 60).padStart(2, '0') + ' ' + t('timezone.saved');
        el.appendChild(option);
        }
        el.value = savedValue;
    }
    }
    settingsInputsLoaded = true;
}
