<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" role="img" aria-labelledby="title desc">
  <title id="title">Eight-pot worker channel mapping</title>
  <desc id="desc">Each pot number uses the soil sensor and valve with the same channel number, from one through eight.</desc>
  <defs>
    <style>
      .board{fill:#25372d;stroke:#13231a;stroke-width:4}.sensor{fill:#fff6dc;stroke:#b87912;stroke-width:2}
      .valve{fill:#eef7fb;stroke:#2d7f9d;stroke-width:2}.pot{fill:#eef7f0;stroke:#287a43;stroke-width:2}
      .link{fill:none;stroke:#64748b;stroke-width:2}.heading{font:700 22px system-ui,sans-serif;fill:#fff;text-anchor:middle}
      .label{font:600 16px system-ui,sans-serif;fill:#1f2937;text-anchor:middle}.small{font:15px system-ui,sans-serif;fill:#475569;text-anchor:middle}
    </style>
  </defs>
  <rect class="board" x="30" y="35" width="920" height="245" rx="22"/>
  <text class="heading" x="490" y="73">V2 8-POT WORKER</text>
  <text class="small" x="490" y="310">Match the same number across the sensor, valve, and pot.</text>
  <g>
    <rect class="sensor" x="55" y="100" width="90" height="55" rx="9"/><text class="label" x="100" y="134">S1</text>
    <rect class="sensor" x="165" y="100" width="90" height="55" rx="9"/><text class="label" x="210" y="134">S2</text>
    <rect class="sensor" x="275" y="100" width="90" height="55" rx="9"/><text class="label" x="320" y="134">S3</text>
    <rect class="sensor" x="385" y="100" width="90" height="55" rx="9"/><text class="label" x="430" y="134">S4</text>
    <rect class="sensor" x="505" y="100" width="90" height="55" rx="9"/><text class="label" x="550" y="134">S5</text>
    <rect class="sensor" x="615" y="100" width="90" height="55" rx="9"/><text class="label" x="660" y="134">S6</text>
    <rect class="sensor" x="725" y="100" width="90" height="55" rx="9"/><text class="label" x="770" y="134">S7</text>
    <rect class="sensor" x="835" y="100" width="90" height="55" rx="9"/><text class="label" x="880" y="134">S8</text>
    <rect class="valve" x="55" y="190" width="90" height="55" rx="9"/><text class="label" x="100" y="224">V1</text>
    <rect class="valve" x="165" y="190" width="90" height="55" rx="9"/><text class="label" x="210" y="224">V2</text>
    <rect class="valve" x="275" y="190" width="90" height="55" rx="9"/><text class="label" x="320" y="224">V3</text>
    <rect class="valve" x="385" y="190" width="90" height="55" rx="9"/><text class="label" x="430" y="224">V4</text>
    <rect class="valve" x="505" y="190" width="90" height="55" rx="9"/><text class="label" x="550" y="224">V5</text>
    <rect class="valve" x="615" y="190" width="90" height="55" rx="9"/><text class="label" x="660" y="224">V6</text>
    <rect class="valve" x="725" y="190" width="90" height="55" rx="9"/><text class="label" x="770" y="224">V7</text>
    <rect class="valve" x="835" y="190" width="90" height="55" rx="9"/><text class="label" x="880" y="224">V8</text>
  </g>
  <g class="link">
    <path d="M100 155v35M210 155v35M320 155v35M430 155v35M550 155v35M660 155v35M770 155v35M880 155v35"/>
  </g>
  <g>
    <rect class="pot" x="55" y="345" width="90" height="45" rx="9"/><text class="label" x="100" y="374">Pot 1</text>
    <rect class="pot" x="165" y="345" width="90" height="45" rx="9"/><text class="label" x="210" y="374">Pot 2</text>
    <rect class="pot" x="275" y="345" width="90" height="45" rx="9"/><text class="label" x="320" y="374">Pot 3</text>
    <rect class="pot" x="385" y="345" width="90" height="45" rx="9"/><text class="label" x="430" y="374">Pot 4</text>
    <rect class="pot" x="505" y="345" width="90" height="45" rx="9"/><text class="label" x="550" y="374">Pot 5</text>
    <rect class="pot" x="615" y="345" width="90" height="45" rx="9"/><text class="label" x="660" y="374">Pot 6</text>
    <rect class="pot" x="725" y="345" width="90" height="45" rx="9"/><text class="label" x="770" y="374">Pot 7</text>
    <rect class="pot" x="835" y="345" width="90" height="45" rx="9"/><text class="label" x="880" y="374">Pot 8</text>
  </g>
</svg>
